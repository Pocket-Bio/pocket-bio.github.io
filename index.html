<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pocket Bio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#FAFAF8">
    <meta name="description"
        content="Pocket Biosciences builds AI systems for biochemical pathways and enzyme design. Introducing Protuna, an open-source framework for iterative protein engineering.">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --bg: #FAFAF8;
            --text: #30302E;
            --muted: #64645F;
            --accent: var(--text);
            --border: #DDDDD7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        ::selection {
            background: var(--accent);
            color: var(--bg);
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 5px;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            min-height: 100svh;
            max-width: 768px;
            margin: 0 auto;
            padding: 72px 24px;
        }

        h1.company-name {
            width: 100%;
            max-width: 600px;
            margin-bottom: 32px;
            font-size: clamp(24px, 7vw, 64px);
            font-weight: 500;
            line-height: 1;
            letter-spacing: -.06em;
            white-space: nowrap;
            color: var(--text);
        }

        p.mission {
            max-width: 500px;
            font-size: clamp(17px, 2.5vw, 20px);
            line-height: 1.6;
            letter-spacing: -.02em;
            color: var(--text);
            text-wrap: balance;
        }

        .announcement {
            width: 100%;
            margin-top: 44px;
            padding: 28px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .announcement h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 22px;
            font-weight: 500;
            line-height: 1.3;
            letter-spacing: -.02em;
        }

        .announcement-badge {
            flex-shrink: 0;
            padding: 3px 7px;
            border-radius: 4px;
            background: var(--accent);
            color: var(--bg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.5;
            letter-spacing: 0;
        }

        .announcement p {
            font-size: 14px;
            line-height: 1.75;
            color: var(--muted);
            text-wrap: pretty;
        }

        .announcement a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
        }

        .announcement a:hover,
        .footer a:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .footer {
            margin-top: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .footer a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            color: var(--muted);
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .container {
                padding: 48px 24px;
            }

            h1.company-name {
                margin-bottom: 28px;
            }

        }
    </style>
</head>

<body>
    <main class="container">
        <h1 class="company-name">Pocket Biosciences</h1>
        <section class="announcement" aria-labelledby="announcement-title">
            <h2 id="announcement-title"><span>Introducing <span style="color: var(--accent);">Protuna</span></span></h2>
            <p>
                De novo protein design has come a long way, but frameworks for learning from lab
                feedback lag behind. To help close that gap, we're
                introducing Protuna, an open-source
                framework for lead optimization.
            </p>
            <a href="https://protuna.org">Explore Protuna <span aria-hidden="true">↗</span></a>
        </section>

        <footer class="footer">
            <a href="mailto:contact@pocketbio.tech">contact@pocketbio.tech</a>
        </footer>
    </main>
</body>

</html>
